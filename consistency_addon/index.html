    <script>
      let countryCode = "others";
      async function getCountryCode(retries = 2) {
        //check cookie first
        /*function ggetCookie(name) {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.indexOf(name + '=') === 0) {
          return decodeURIComponent(cookie.substring(name.length + 1));
        }
      }
      return null;
    }
    const consent = ggetCookie('tracking_consent');
    if (!consent) return countryCode;*/

        const url = "https://countries.dev/ip";
        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => {
              controller.abort();
            }, 5000);
            const response = await fetch(url, {
              signal: controller.signal,
            });
            clearTimeout(timeout);
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            const data = await response.json();
            // Only update after successful API response
            if (data?.countryCode) {
              countryCode = data.countryCode;
              countryName = data.country.name;
            }
            return {
              code: data.countryCode,
              name: data.country?.name,
              flags: data.country?.flags,
              timezones: data.country?.timezones,
            };
          } catch (error) {
            console.warn(`Country API attempt ${attempt + 1} failed:`, error);
            if (attempt < retries) {
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
          }
        }
        // If all attempts fail, keep the default value
        return countryCode;
      }
      getCountryCode().then((code) => {
        console.log("Country details:", code);
      });
    </script>
